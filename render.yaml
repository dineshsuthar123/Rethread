# Free-only deployment. Reuses the verified API service.
# Jobs persist in external free PostgreSQL; Actions runs the trusted batch worker.
services:
  - type: web
    name: rethread-api
    runtime: docker
    repo: https://github.com/dineshsuthar123/Rethread
    branch: main
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: API_DB_POOL_SIZE
        value: 5
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: WORKER_MODE
        value: github-actions
      - key: FREE_ONLY
        value: "true"
      - key: CONTROL_REPOSITORY
        value: dineshsuthar123/Rethread
      - key: CONTROL_REPOSITORY_ID
        value: 1161587671
      - key: CONTROL_REF
        value: main
      - key: CONTROL_INSTALLATION_ID
        sync: false
