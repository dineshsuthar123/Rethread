[project]
name = "rethread-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["e2b==2.56.0", "psycopg[binary,pool]>=3.2.12,<4", "pydantic>=2.12,<3", "httpx>=0.28.1,<1", "PyJWT[crypto]>=2.10.1,<3"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "pytest-json-report==1.5.0",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python", "infrastructure/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["agent/rethread/**/*.py", "tests/python/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
